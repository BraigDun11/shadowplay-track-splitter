name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach the exe to a release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install numpy tkinterdnd2 pyinstaller
          choco install ffmpeg -y --no-progress
      - name: Self-test on synthetic data
        run: python tests/test_synthetic.py
      - name: Mono-stretch regression test
        run: python tests/test_mono_stretch.py
      - name: Chunk-length jitter regression test
        run: python tests/test_jitter.py
      - name: Hole handling test
        run: python tests/test_holes.py
      - name: Updater test
        run: python tests/test_updater.py
      - name: Cancel test
        run: python tests/test_cancel.py
      - name: Video hole test
        run: python tests/test_vgaps.py
      - name: PC mono test
        run: python tests/test_pcmono.py
      - name: Silent PC test
        run: python tests/test_silent_pc.py
      - name: GUI smoke test
        run: python tests/test_gui_smoke.py
      - name: Build exe
        run: pyinstaller --onefile --noconsole --icon assets/icon.ico --add-data "assets;assets" --collect-all tkinterdnd2 --name ShadowPlayTrackSplitter gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowPlayTrackSplitter-windows
          path: dist/ShadowPlayTrackSplitter.exe
      - name: Attach exe to the release (only for tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ShadowPlayTrackSplitter.exe
      - name: Publish intermediate version (1.4.11 ...) as a pre-release for the developer update channel
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import re;print(re.search(r'APP_VERSION = \"([0-9.]+)\"',open('gui.py').read()).group(1))")
          echo "version $VER"
          if [ "$(echo "$VER" | tr -cd . | wc -c)" -ge 2 ]; then
            if gh release view "v$VER" >/dev/null 2>&1; then
              echo "release v$VER already exists"
            else
              gh release create "v$VER" dist/ShadowPlayTrackSplitter.exe --target "$GITHUB_SHA" --prerelease \
                --title "v$VER (intermediate)" --notes "Intermediate build for the developer update channel. Stable users get only releases like 1.4, 1.5."
            fi
          else
            echo "stable version: its release is made by hand"
          fi
