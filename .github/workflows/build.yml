name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach the exe to a release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install numpy tkinterdnd2 pyinstaller
          choco install ffmpeg -y --no-progress
      - name: Self-test on synthetic data
        run: python tests/test_synthetic.py
      - name: Mono-stretch regression test
        run: python tests/test_mono_stretch.py
      - name: Chunk-length jitter regression test
        run: python tests/test_jitter.py
      - name: Hole handling test
        run: python tests/test_holes.py
      - name: Updater test
        run: python tests/test_updater.py
      - name: Cancel test
        run: python tests/test_cancel.py
      - name: Video hole test
        run: python tests/test_vgaps.py
      - name: PC mono test
        run: python tests/test_pcmono.py
      - name: Silent PC test
        run: python tests/test_silent_pc.py
      - name: GUI smoke test
        run: python tests/test_gui_smoke.py
      - name: Build exe
        run: pyinstaller --onefile --noconsole --icon assets/icon.ico --add-data "assets;assets" --collect-all tkinterdnd2 --name ShadowPlayTrackSplitter gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowPlayTrackSplitter-windows
          path: dist/ShadowPlayTrackSplitter.exe
      - name: Attach exe to the release (only for tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ShadowPlayTrackSplitter.exe
      - name: Work out the version
        id: ver
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: python
        run: |
          import re, os
          v = re.search(r'APP_VERSION = "([0-9.]+)"', open("gui.py", encoding="utf-8").read()).group(1)
          inter = v.count(".") >= 2
          print("version", v, "intermediate:", inter)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("version=%s\ninter=%s\n" % (v, "yes" if inter else "no"))
      - name: Publish intermediate version as a pre-release (developer update channel)
        if: steps.ver.outputs.inter == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.ver.outputs.version }} (intermediate)
          body: Intermediate build for the developer update channel. Stable users get only releases like 1.4, 1.5.
          prerelease: true
          files: dist/ShadowPlayTrackSplitter.exe
